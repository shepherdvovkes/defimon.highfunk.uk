<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereum Archive Node Statistics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.min.js"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: #1a1a1a; 
            color: #fff; 
        }
        .container { 
            max-width: 1800px; 
            margin: 0 auto; 
        }
        .header { 
            text-align: center; 
            margin-bottom: 30px; 
        }
        .header h1 { 
            color: #00ff88; 
            margin: 0; 
        }
        .stats-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); 
            gap: 20px; 
        }
        .card { 
            background: #2a2a2a; 
            border-radius: 10px; 
            padding: 20px; 
            border: 1px solid #333; 
        }
        .card h2 { 
            color: #00ff88; 
            margin-top: 0; 
        }
        .stat-item { 
            margin: 15px 0; 
            padding: 15px; 
            background: #333; 
            border-radius: 8px; 
        }
        .stat-label { 
            font-weight: bold; 
            color: #ccc; 
            margin-bottom: 8px; 
            display: block; 
        }
        .stat-value { 
            color: #00ff88; 
            font-size: 1.2em; 
        }
        .progress-bar { 
            width: 100%; 
            height: 20px; 
            background: #444; 
            border-radius: 10px; 
            overflow: hidden; 
            margin: 8px 0; 
        }
        .progress-fill { 
            height: 100%; 
            background: linear-gradient(90deg, #00ff88, #00cc6a); 
            transition: width 0.3s ease; 
        }
        .progress-fill.warning { 
            background: linear-gradient(90deg, #ffaa00, #ff8800); 
        }
        .progress-fill.danger { 
            background: linear-gradient(90deg, #ff4444, #cc3333); 
        }
        .progress-text { 
            text-align: center; 
            margin-top: 5px; 
            font-size: 0.9em; 
            color: #aaa; 
        }
        .error { 
            color: #ff4444; 
        }
        .success { 
            color: #00ff88; 
        }
        .warning { 
            color: #ffaa00; 
        }
        .refresh-time { 
            text-align: center; 
            margin-top: 20px; 
            color: #888; 
        }
        .chart-container { 
            position: relative; 
            height: 400px; 
            margin: 20px 0; 
        }
        .charts-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(600px, 1fr)); 
            gap: 20px; 
            margin-top: 30px; 
        }
        .time-controls { 
            background: #333; 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
        }
        .time-controls select, 
        .time-controls input { 
            background: #444; 
            color: #fff; 
            border: 1px solid #555; 
            padding: 8px; 
            border-radius: 4px; 
            margin: 0 10px; 
        }
        .time-controls button { 
            background: #00ff88; 
            color: #000; 
            border: none; 
            padding: 8px 16px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: bold; 
        }
        .time-controls button:hover { 
            background: #00cc6a; 
        }
        .quick-time-buttons { 
            margin: 10px 0; 
        }
        .quick-time-buttons button { 
            background: #555; 
            color: #fff; 
            border: 1px solid #666; 
            padding: 6px 12px; 
            border-radius: 4px; 
            cursor: pointer; 
            margin: 0 5px; 
        }
        .quick-time-buttons button:hover { 
            background: #666; 
        }
        .quick-time-buttons button.active { 
            background: #00ff88; 
            color: #000; 
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error {
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            border: 1px solid #ff6b6b;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            margin: 10px 0;
        }
        .error small {
            color: #ccc;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Ethereum Archive Node Statistics</h1>
            <p>Advanced monitoring with time-based charts and database storage</p>
        </div>
        
        <div class="time-controls">
            <h3>📅 Time Period Selection</h3>
            <div class="quick-time-buttons">
                <button onclick="setTimeRange('1h')" class="active">1 Hour</button>
                <button onclick="setTimeRange('6h')">6 Hours</button>
                <button onclick="setTimeRange('24h')">24 Hours</button>
                <button onclick="setTimeRange('7d')">7 Days</button>
                <button onclick="setTimeRange('30d')">30 Days</button>
            </div>
        </div>
        
        <div class="stats-grid">
            <div class="card">
                <h2>⚡ Geth Sync Progress</h2>
                <div id="geth-stats">Loading...</div>
            </div>
            <div class="card">
                <h2>🏮 Lighthouse Status</h2>
                <div id="lighthouse-stats">Loading...</div>
            </div>
            <div class="card">
                <h2>💾 Storage Usage</h2>
                <div id="storage-stats">Loading...</div>
            </div>
            <div class="card">
                <div id="system-stats">Loading...</div>
            </div>
        </div>
        
        <div class="charts-grid">
            <div class="card">
                <h2>📊 System Performance</h2>
                <div class="chart-container">
                    <canvas id="systemChart"></canvas>
                </div>
            </div>
            <div class="card">
                <h2>🌐 Network Bandwidth</h2>
                <div class="chart-container">
                    <canvas id="networkChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="refresh-time" id="refresh-time">Last updated: Never</div>
    </div>

    <script>
        // Global variables
        let currentTimeRange = "1h";
        let systemChart, networkChart;
        let currentData = {};
        let isLoading = false;

        // Chart.js configuration
        Chart.defaults.color = "#ccc";
        Chart.defaults.borderColor = "#444";
        Chart.defaults.backgroundColor = "rgba(0, 255, 136, 0.1)";

        // Check server health
        async function checkServerHealth() {
            try {
                const response = await fetch("/api/health", { timeout: 5000 });
                if (response.ok) {
                    console.log("Server health check passed");
                    return true;
                }
            } catch (error) {
                console.error("Server health check failed:", error);
            }
            return false;
        }

        // Initialize charts
        function initializeCharts() {
            const systemCtx = document.getElementById("systemChart").getContext("2d");
            systemChart = new Chart(systemCtx, {
                type: "line",
                data: { 
                    labels: [], 
                    datasets: [
                        { 
                            label: "CPU %", 
                            data: [], 
                            borderColor: "#00ff88", 
                            backgroundColor: "rgba(0, 255, 136, 0.1)",
                            tension: 0.4
                        },
                        { 
                            label: "RAM %", 
                            data: [], 
                            borderColor: "#ffaa00", 
                            backgroundColor: "rgba(255, 170, 0, 0.1)",
                            tension: 0.4
                        }
                    ] 
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#ccc"
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: "#ccc"
                            },
                            grid: {
                                color: "#444"
                            }
                        },
                        y: {
                            ticks: {
                                color: "#ccc"
                            },
                            grid: {
                                color: "#444"
                            }
                        }
                    }
                }
            });

            const networkCtx = document.getElementById("networkChart").getContext("2d");
            networkChart = new Chart(networkCtx, {
                type: "line",
                data: { 
                    labels: [], 
                    datasets: [
                        { 
                            label: "RX (MB/s)", 
                            data: [], 
                            borderColor: "#3b82f6", 
                            backgroundColor: "rgba(59, 130, 246, 0.1)",
                            tension: 0.4
                        },
                        { 
                            label: "TX (MB/s)", 
                            data: [], 
                            borderColor: "#8b5cf6", 
                            backgroundColor: "rgba(139, 92, 246, 0.1)",
                            tension: 0.4
                        }
                    ] 
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#ccc"
                            }
                        }
                    },
                    scales: {
                        x: {
                            ticks: {
                                color: "#ccc"
                            },
                            grid: {
                                color: "#444"
                            }
                        },
                        y: {
                            ticks: {
                                color: "#ccc"
                            },
                            grid: {
                                color: "#444"
                            }
                        }
                    }
                }
            });
        }

        // Set time range function
        function setTimeRange(range) {
            if (isLoading) return;
            
            currentTimeRange = range;
            document.querySelectorAll(".quick-time-buttons button").forEach(btn => {
                btn.classList.remove("active");
            });
            event.target.classList.add("active");
            loadHistoricalData();
        }

        // Load historical data
        async function loadHistoricalData() {
            if (isLoading) return;
            
            isLoading = true;
            showLoadingState();
            
            try {
                const response = await fetch("/api/history/system");
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                updateCharts(data);
            } catch (error) {
                console.error("Error loading historical data:", error);
                showErrorState();
            } finally {
                isLoading = false;
                hideLoadingState();
            }
        }

        // Show loading state
        function showLoadingState() {
            const buttons = document.querySelectorAll(".quick-time-buttons button");
            buttons.forEach(btn => {
                if (btn.classList.contains("active")) {
                    btn.innerHTML = '<span class="loading"></span>Loading...';
                    btn.disabled = true;
                }
            });
        }

        // Hide loading state
        function hideLoadingState() {
            const buttons = document.querySelectorAll(".quick-time-buttons button");
            buttons.forEach(btn => {
                if (btn.classList.contains("active")) {
                    btn.innerHTML = btn.textContent.replace('<span class="loading"></span>Loading...', '');
                    btn.disabled = false;
                }
            });
        }

        // Show error state
        function showErrorState() {
            const charts = document.querySelectorAll(".chart-container");
            charts.forEach(chart => {
                chart.innerHTML = '<div style="text-align: center; color: #ff4444; padding: 20px;">Error loading chart data</div>';
            });
        }

        // Update charts with data
        function updateCharts(data) {
            if (!data || data.length === 0) {
                console.warn("No data received for charts");
                return;
            }
            
            const labels = data.map((d, i) => i);
            
            // Update system chart
            systemChart.data.labels = labels;
            systemChart.data.datasets[0].data = data.map(d => d.cpu_percent || 0);
            systemChart.data.datasets[1].data = data.map(d => d.memory_percent || 0);
            systemChart.update();
            
            // Update network chart
            networkChart.data.labels = labels;
            networkChart.data.datasets[0].data = data.map(d => 
                d.network_rx_rate ? (d.network_rx_rate / 1024 / 1024).toFixed(2) : 0
            );
            networkChart.data.datasets[1].data = data.map(d => 
                d.network_tx_rate ? (d.network_tx_rate / 1024 / 1024).toFixed(2) : 0
            );
            networkChart.update();
        }

        // Fetch current stats
        async function fetchStats() {
            try {
                const response = await fetch("/api/stats", {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    },
                    timeout: 10000
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }
                
                const data = await response.json();
                updateDisplay(data);
                currentData = data;
                document.getElementById("refresh-time").textContent = 
                    "Last updated: " + new Date().toLocaleTimeString();
            } catch (error) {
                console.error("Error fetching stats:", error);
                showStatsError();
            }
        }

        // Show stats error
        function showStatsError() {
            const statElements = ["geth-stats", "lighthouse-stats", "storage-stats", "system-stats"];
            statElements.forEach(id => {
                const element = document.getElementById(id);
                if (element) {
                    element.innerHTML = '<div class="error">⚠️ Connection Error<br><small>Check if the server is running on port 3000</small></div>';
                }
            });
        }

        // Update display with data
        function updateDisplay(data) {
            // Update Geth stats
            if (data.geth && data.geth.result) {
                const syncing = data.geth.result;
                const isSyncing = syncing !== false;
                const currentBlock = isSyncing ? parseInt(syncing.currentBlock, 16) : 0;
                const highestBlock = isSyncing ? parseInt(syncing.highestBlock, 16) : 0;
                const progress = highestBlock > 0 ? ((currentBlock / highestBlock) * 100) : 0;
                const statusHtml = isSyncing ? 
                    '<span class="warning">Syncing</span>' : 
                    '<span class="success">Synced</span>';

                const progressClass = progress > 80 ? "" : progress > 50 ? "warning" : "danger";
                document.getElementById("geth-stats").innerHTML = 
                    '<div class="stat-item">' +
                        '<span class="stat-label">Status:</span> ' + statusHtml +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Current Block:</span> ' +
                        '<span class="stat-value">' + currentBlock.toLocaleString() + '</span>' +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Sync Progress:</span>' +
                        '<div class="progress-bar">' +
                            '<div class="progress-fill ' + progressClass + '" style="width: ' + progress + '%"></div>' +
                        '</div>' +
                        '<div class="progress-text">' + progress.toFixed(2) + '% (' + 
                        currentBlock.toLocaleString() + ' / ' + highestBlock.toLocaleString() + ')</div>' +
                    '</div>';
            }

            // Update Lighthouse stats
            if (data.lighthouse && data.lighthouse.data) {
                const lighthouse = data.lighthouse.data;
                const isSyncing = lighthouse.is_syncing;
                const isOffline = lighthouse.el_offline;
                const headSlot = parseInt(lighthouse.head_slot) || 0;
                const syncDistance = parseInt(lighthouse.sync_distance) || 0;
                
                let statusHtml;
                if (isOffline) {
                    statusHtml = '<span class="danger">Offline</span>';
                } else if (isSyncing) {
                    statusHtml = '<span class="warning">Syncing</span>';
                } else {
                    statusHtml = '<span class="success">Synced</span>';
                }

                document.getElementById("lighthouse-stats").innerHTML = 
                    '<div class="stat-item">' +
                        '<span class="stat-label">Status:</span> ' + statusHtml +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Head Slot:</span> ' +
                        '<span class="stat-value">' + headSlot.toLocaleString() + '</span>' +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Sync Distance:</span> ' +
                        '<span class="stat-value">' + syncDistance + '</span>' +
                    '</div>';
            }

            // Update system stats
            if (data.system && !data.system.error) {
                const system = data.system;
                const cpuPercent = system.cpuPercent || 0;
                const memPercent = system.memPercent || 0;
                
                document.getElementById("system-stats").innerHTML = 
                    '<h2>💻 System Resources</h2>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">CPU Usage:</span>' +
                        '<div class="progress-bar">' +
                            '<div class="progress-fill" style="width: ' + cpuPercent + '%"></div>' +
                        '</div>' +
                        '<div class="progress-text">' + cpuPercent.toFixed(1) + '%</div>' +
                    '</div>' +
                    '<div class="stat-item">' +
                        '<span class="stat-label">Memory Usage:</span>' +
                        '<div class="progress-bar">' +
                            '<div class="progress-fill" style="width: ' + memPercent + '%"></div>' +
                        '</div>' +
                        '<div class="progress-text">' + memPercent.toFixed(1) + '%</div>' +
                    '</div>';

                // Update storage stats
                if (system.diskUsage && system.diskUsage.length > 0) {
                    let storageHtml = '<h2>💾 Storage Usage</h2>';
                    system.diskUsage.forEach(disk => {
                        if (disk.usage !== null) {
                            storageHtml += 
                                '<div class="stat-item">' +
                                    '<span class="stat-label">' + disk.mount + ':</span>' +
                                    '<div class="progress-bar">' +
                                        '<div class="progress-fill" style="width: ' + disk.usage + '%"></div>' +
                                    '</div>' +
                                    '<div class="progress-text">' + disk.usage + '% used</div>' +
                                '</div>';
                        }
                    });
                    document.getElementById("storage-stats").innerHTML = storageHtml;
                }
            }
        }

        // Initialize everything when page loads
        document.addEventListener('DOMContentLoaded', async function() {
            initializeCharts();
            
            // Check server health first
            const isHealthy = await checkServerHealth();
            if (!isHealthy) {
                console.warn("Server health check failed, but continuing...");
            }
            
            fetchStats();
            loadHistoricalData();
            
            // Refresh data every 30 seconds
            setInterval(fetchStats, 30000);
        });
    </script>
</body>
</html>
