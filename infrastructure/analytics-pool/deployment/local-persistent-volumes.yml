apiVersion: v1
kind: PersistentVolume
metadata:
  name: defi-hot-storage-pv
  labels:
    app: defi-analytics
    storage-tier: hot
    drive-type: nvme
spec:
  capacity:
    storage: 500Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-nvme
  local:
    path: /tmp/defi-hot-storage
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - docker-desktop
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: defi-warm-storage-pv
  labels:
    app: defi-analytics
    storage-tier: warm
    drive-type: usb
spec:
  capacity:
    storage: 2Ti
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-usb
  local:
    path: /tmp/defi-warm-storage
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - docker-desktop
