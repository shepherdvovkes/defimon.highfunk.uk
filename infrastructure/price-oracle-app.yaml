runtime: python311
service: price-oracle-api

env_variables:
  NODE_ENV: production
  DB_HOST: /cloudsql/defimon-ethereum-node:us-central1:defimon-postgres-instance
  DB_PORT: 5432
  DB_USER: defimon_user
  DB_PASSWORD: defimon_secure_password_2024
  DB_NAME: defi_analytics
  REDIS_HOST: 10.0.0.3
  REDIS_PORT: 6379
  KAFKA_BOOTSTRAP_SERVERS: 10.0.0.4:9092

entrypoint: uvicorn main:app --host 0.0.0.0 --port $PORT

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 1
  max_instances: 5
  target_throughput_utilization: 0.6

resources:
  cpu: 1
  memory_gb: 2
  disk_size_gb: 10

beta_settings:
  cloud_sql_instances: defimon-ethereum-node:us-central1:defimon-postgres-instance

handlers:
  - url: /.*
    script: auto
    secure: always
